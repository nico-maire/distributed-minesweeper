version: '3.8'

services:
  leader:
    build: 
      context: ./backend
      dockerfile: Dockerfile.backend
    command: python -u server.py
    ports:
      - "5000:5000"
    environment:
      - SLAVE_HOST=follower-1
      - SLAVE_PORT=6000
    networks:
      - minesweeper-net

  follower-1:
    build: 
      context: ./backend
      dockerfile: Dockerfile.backend
    command: python -u slave.py
    ports:
      - "6000:6000"
    environment:
      - NEXT_REPLICA_HOST=follower-2
      - NEXT_REPLICA_PORT=7000
    networks:
      - minesweeper-net

  follower-2:
    build: 
      context: ./backend
      dockerfile: Dockerfile.backend
    command: python -u slave.py
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
    networks:
      - minesweeper-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    # network_mode: host gives Tkinter access to the X11 socket on Linux
    # and lets the container reach the backend via localhost:<exposed-ports>
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - LEADER_HOST=localhost
      - LEADER_PORT=5000
      - SLAVE_1_HOST=localhost
      - SLAVE_1_PORT=6000
      - SLAVE_2_HOST=localhost
      - SLAVE_2_PORT=7000
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    depends_on:
      - leader

networks:
  minesweeper-net:
    driver: bridge
